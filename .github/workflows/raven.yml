name: Update Git Raven

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-raven:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Fixed: Uses 'collect', passes the username directly, and sets the GH_TOKEN environment variable
      - name: Collect Live GitHub Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo run -- collect ${{ github.repository_owner }} --output MyGithubAccount.json

      - name: Render Raven GIF
        run: |
          cargo run --release -- render MyGithubAccount.json --output-dir output

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update raven animation"
          git push