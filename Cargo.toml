[package]
name = "git-raven"
version = "1.0.2"
edition = "2024"
rust-version = "1.88"
description = "A sleek, minimalist pixel-art raven resting on a subtle perch. The base color will be deep charcoal, ensuring it reads clearly at 256x256 native resolution."
repository = "https://github.com/Rodgerss111/git-raven"
readme = "README.md"
license = "MIT"
keywords = ["github", "profile", "raven", "pixel-art", "gif"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/.github", "/docs"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
